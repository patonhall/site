name: Vessel positions

# Refreshes assets/data/vessels.json from AIS. Cron only fires on the default
# branch, and GitHub queues rather than guarantees the time -- a missed run
# just means the page shows an older collection stamp, which it displays.
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

# The commit below pushes to main.
permissions:
  contents: write

concurrency:
  group: vessels
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install --quiet websockets

      - name: Collect AIS positions
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
        run: python3 scripts/fetch_vessels.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet assets/data/vessels.json; then
            echo "no change"
            exit 0
          fi
          git add assets/data/vessels.json
          git commit -m "Update vessel positions"
          # Another workflow (approve-request) also pushes to main, so rebase
          # rather than fail or force.
          git pull --rebase --autostash origin main
          git push

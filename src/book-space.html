<!--
title: Book Space — Paton Hall
class: page-inner
desc: Request a space or zone at Paton Hall for your activity.
-->
  <main class="main">
    <h1 class="page-title">Book Space</h1>

    <p>Tell us what you need and when. This is a request, not a confirmation —
    an admin checks it against the schedule and follows up by email.</p>

    <hr class="rule">

    <form id="book-space-form" class="signup-form"
          action="https://docs.google.com/forms/d/e/1FAIpQLScbCJfTWbXL_G6jwuWXaVANMIdmCLCptHboW5DP9JjXJoB1yA/formResponse"
          method="POST" target="_blank">
      <div class="full">
        <label for="bs-name">Name</label>
        <input id="bs-name" type="text" name="entry.1317811418" required>
      </div>

      <div class="full">
        <label for="bs-email">Email</label>
        <input id="bs-email" type="email" name="entry.823169727" required>
      </div>

      <div class="full">
        <label for="bs-space">Space / Zone</label>
        <!-- Options are static, not built by JS, so the no-JS fallback POST can
             still carry a space. `value` is the Google Form's own option string
             (plain hyphen) because Google validates the answer against its list;
             the visible text is the site's em-dash form. Kept in step with
             assets/js/spaces.js by tests/test_book_space_options.py. -->
        <select id="bs-space" name="entry.187152365" required>
          <option value="" selected disabled>Choose a space</option>
          <option value="A - Blackboard">A — Blackboard</option>
          <option value="B - Assembly Zone">B — Assembly Zone</option>
          <option value="C - Whiteboard">C — Whiteboard</option>
          <option value="D - Assembly Zone">D — Assembly Zone</option>
          <option value="E - Pool Table">E — Pool Table</option>
          <option value="F - Work Table 1">F — Work Table 1</option>
          <option value="G - Work Table 2">G — Work Table 2</option>
          <option value="H - Loading Area">H — Loading Area</option>
          <option value="I - Special Request">I — Special Request</option>
        </select>
      </div>

      <div>
        <label for="bs-start-date">Start date</label>
        <input id="bs-start-date" type="date" required>
      </div>
      <div>
        <label for="bs-start-time">Start time</label>
        <input id="bs-start-time" type="time" required>
      </div>

      <div>
        <label for="bs-end-date">End date</label>
        <input id="bs-end-date" type="date" required>
      </div>
      <div>
        <label for="bs-end-time">End time</label>
        <input id="bs-end-time" type="time" required>
      </div>

      <div class="full">
        <label for="bs-purpose">Purpose / nature of activity</label>
        <textarea id="bs-purpose" name="entry.673408033" rows="4" required></textarea>
      </div>

      <p id="bs-availability" class="form-status" role="status"></p>

      <div class="full">
        <button type="submit">Request booking</button>
      </div>
    </form>

    <p id="bs-status" class="form-status" role="status"></p>
  </main>

  <script src="assets/js/book-space.js" defer></script>

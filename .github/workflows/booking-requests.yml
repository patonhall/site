name: Booking request triage

# Polls Kit for new Book Space requests, checks each one against
# assets/data/events.json for a scheduling conflict, and opens a GitHub
# Issue with the result — closed immediately if clear (an "approved"
# signal), left open if it conflicts. Never writes to the repo: a real
# event only ever gets added by a human, through admin-events.html.

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes
  workflow_dispatch:          # and on demand, from the Actions tab

permissions:
  contents: read
  issues: write

concurrency:
  group: booking-requests
  cancel-in-progress: false

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Kit for new booking requests
        env:
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/check_booking_requests.py

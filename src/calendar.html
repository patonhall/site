pagename: Calendar

  <!-- Agenda view, rendered from assets/data/events.json by calendar.js.
       Book Space links to the public request form (see book-space.html and
       docs/superpowers/specs/2026-08-18-patonhall-booking-training-requests-design.md).
       View switching and sign-in are still separate, unbuilt work. -->
  <div class="cal">

    <header class="cal__bar">
      <!-- Wrapped so both sit in the bar's first grid track, which matches
           .cal__body's agenda column. Book Space then right-aligns to the
           edge of the event list it belongs to, rather than to the far edge
           of the page out over the detail pane. -->
      <div class="cal__bar-main">
        <h1 class="page-title page-title--cal">Calendar</h1>
        <div class="cal__actions">
          <a href="book-space.html">Book Space</a>
        </div>
      </div>
    </header>

    <div class="cal__body">
      <section class="cal__agenda" id="cal-agenda">
        <p class="cal__empty">Loading&hellip;</p>
      </section>

      <section class="cal__detail" id="cal-detail">
        <p class="cal__empty">Select an event to see its details.</p>
      </section>
    </div>

  </div>

  <!-- Mobile-only: replaces the header's "Book Space" text link (hidden at
       this breakpoint, see .page-calendar .cal__bar) and the status bar
       (also hidden here — redundant on the page it links to) with a single
       fixed circular action, the same treatment as .social's icon buttons. -->
  <a href="book-space.html" class="cal__fab" aria-label="Book Space"><span aria-hidden="true">+</span></a>

  <script src="assets/js/calendar.js" defer></script>
